server.port=8085
spring.application.name=busbooking

# Jackson 3: reject enum ordinals (including role=0/1) instead of changing roles implicitly.
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

# PostgreSQL: supply credentials using environment variables (see .env.example).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/busbooking_dev_fresh}
spring.datasource.username=${DB_USERNAME:busbooking_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Ho_Chi_Minh'
# PostgreSQL error Detail can contain the full failing row, including password hashes.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Access JWT: independent of the email OTP key. No default development/production secret.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.issuer=${JWT_ISSUER:busbooking}

# Email verification: OTP values are never stored directly.
auth.email-otp-secret=${EMAIL_OTP_SECRET}
auth.mail-from=${SMTP_FROM:noreply@example.com}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# API docs are opt-in outside dev/test. No trusted proxy is configured by this project.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
auth.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
auth.rate-limit.window-seconds=${AUTH_RATE_WINDOW_SECONDS:60}
auth.rate-limit.max-keys=${AUTH_RATE_MAX_KEYS:10000}
auth.rate-limit.register-limit=${AUTH_RATE_REGISTER_LIMIT:5}
auth.rate-limit.login-limit=${AUTH_RATE_LOGIN_LIMIT:10}
auth.rate-limit.verify-limit=${AUTH_RATE_VERIFY_LIMIT:20}
auth.rate-limit.resend-limit=${AUTH_RATE_RESEND_LIMIT:5}

# Opt-in creation of the only SUPER_ADMIN, restricted to dev/test. Never promotes existing users.
auth.bootstrap-super-admin.enabled=${BOOTSTRAP_SUPER_ADMIN_ENABLED:false}
auth.bootstrap-super-admin.email=${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
auth.bootstrap-super-admin.password=${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
auth.bootstrap-super-admin.full-name=${BOOTSTRAP_SUPER_ADMIN_FULL_NAME:}
auth.bootstrap-super-admin.phone=${BOOTSTRAP_SUPER_ADMIN_PHONE:}
